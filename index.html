<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fire Station">
<meta name="theme-color" content="#8fd6ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fire Station</title>
<style>
/* One full-screen pixel world: sky on top, station in the middle, paint pots at the thumb's reach. */
:root {
  --sky: #8fd6ff;
  --grass: #5aa84c;
  --ink: #1d1a2b;
  --fire: #e8222b;
  --fire-dark: #9c1420;
  --cream: #fff6e0;
  color-scheme: light;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--grass);
}
body {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--sky);
}
#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}
#start {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(29, 26, 43, 0.35);
}
#start[hidden] { display: none; }
#play {
  width: min(42vmin, 220px);
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 50%;
  border: 0;
  background: var(--fire);
  box-shadow: 0 10px 0 var(--fire-dark), 0 0 0 8px var(--cream);
  cursor: pointer;
  display: grid;
  place-items: center;
  animation: pulse 1.4s ease-in-out infinite;
}
#play:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--fire-dark), 0 0 0 8px var(--cream); }
#play:focus-visible { outline: 4px solid var(--ink); outline-offset: 12px; }
#play svg { width: 45%; height: 45%; margin-left: 9%; }
@keyframes pulse { 50% { scale: 1.06; } }
@media (prefers-reduced-motion: reduce) { #play { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="start">
    <button id="play" aria-label="Play">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0 L10 5 L1 10 Z" fill="#fff6e0"/></svg>
    </button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/station.js"></script>
<script src="js/fire.js"></script>
<script src="js/help.js"></script>
<script src="js/amb.js"></script>
<script src="js/police.js"></script>
<script src="js/wash.js"></script>
<script src="js/stickers.js"></script>
<script src="js/main.js"></script>
</body>
</html>

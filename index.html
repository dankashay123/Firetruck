<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fire Station">
<meta name="theme-color" content="#8fd6ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Fire Station</title>
<style>
/* One full-screen pixel world: sky on top, station in the middle, paint pots at the thumb's reach. */
:root {
  --sky: #8fd6ff;
  --grass: #5aa84c;
  --ink: #1d1a2b;
  --fire: #e8222b;
  --fire-dark: #9c1420;
  --cream: #fff6e0;
  color-scheme: light;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: linear-gradient(var(--sky) 55%, var(--grass) 55%);
}
body {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#stage {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  left: env(safe-area-inset-left, 0px);
  right: env(safe-area-inset-right, 0px);
  overflow: hidden;
  background: var(--sky);
}
#screen {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  touch-action: none;
}
#start {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(29, 26, 43, 0.35);
}
#start[hidden] { display: none; }
#play {
  width: min(42vmin, 220px);
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 50%;
  border: 0;
  background: var(--fire);
  box-shadow: 0 10px 0 var(--fire-dark), 0 0 0 8px var(--cream);
  cursor: pointer;
  display: grid;
  place-items: center;
  animation: pulse 1.4s ease-in-out infinite;
}
#play:active { transform: translateY(6px); box-shadow: 0 4px 0 var(--fire-dark), 0 0 0 8px var(--cream); }
#play:focus-visible { outline: 4px solid var(--ink); outline-offset: 12px; }
#play svg { width: 45%; height: 45%; margin-left: 9%; }
@keyframes pulse { 50% { scale: 1.06; } }
@media (prefers-reduced-motion: reduce) { #play { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen"></canvas>
  <div id="start">
    <button id="play" aria-label="Play">
      <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0 L10 5 L1 10 Z" fill="#fff6e0"/></svg>
    </button>
  </div>
</div>
<script>
(() => {
'use strict';

/* ---------- setup ---------- */
const stage = document.getElementById('stage');
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const lo = document.createElement('canvas');   // low-res pixel buffer
let g = lo.getContext('2d');           // current draw target
let W = 320, H = 200, S = 1, dpr = 1;
let T = 0;                                       // seconds since load
let started = false;

/* ---------- colors ---------- */
// [light, mid, dark] ramps for each paint pot
const PALETTE = [
  ['red',    'Red',    ['#ff7a6b', '#e8222b', '#a3121d']],
  ['orange', 'Orange', ['#ffb15a', '#f57a12', '#b14c06']],
  ['yellow', 'Yellow', ['#fff27a', '#ffd21f', '#c99410']],
  ['green',  'Green',  ['#8fe36b', '#3fb43a', '#1f7a2a']],
  ['blue',   'Blue',   ['#6fb6ff', '#2a6fe0', '#1a3f9a']],
  ['purple', 'Purple', ['#c39bff', '#8a4fd9', '#55289a']],
  ['pink',   'Pink',   ['#ffb3da', '#ff6fb4', '#c73d84']],
  ['white',  'White',  ['#ffffff', '#e9eef2', '#b4bec8']],
  ['black',  'Black',  ['#5a5f6e', '#2f3240', '#16171f']],
];
const COLOR = Object.fromEntries(PALETTE.map(([k, n, c]) => [k, { name: n, c }]));
const WARM = new Set(['red', 'orange', 'pink']);
const GLASS = '#bfe6ff', GLASS2 = '#9fd2ef', CHROME = '#cfd6dd', TIRE = '#24262d', WELL = '#1b1c22';
const RED_ON = '#ff3b3b', RED_OFF = '#8c2a2a', BLUE_ON = '#3b8bff', BLUE_OFF = '#26407a';

/* ---------- vehicles ---------- */
const V = [
  { kind: 'police', name: 'Police car', len: 56, h: 29, color: 'blue' },
  { kind: 'fire',   name: 'Fire truck', len: 66, h: 38, color: 'red' },
  { kind: 'amb',    name: 'Ambulance',  len: 62, h: 36, color: 'white' },
];
try {
  const saved = JSON.parse(localStorage.getItem('firestation.colors') || 'null');
  if (Array.isArray(saved)) saved.forEach((k, i) => { if (V[i] && COLOR[k]) V[i].color = k; });
} catch (e) { /* storage unavailable */ }
function saveColors() {
  try { localStorage.setItem('firestation.colors', JSON.stringify(V.map(v => v.color))); } catch (e) {}
}
for (const v of V) Object.assign(v, { x: 0, y: 0, homeX: 0, state: 'parked', t: 0, speed: 0, lap: false, rot: 0, hop: 0, puff: 0, stopSiren: null });
let selected = 1;  // the fire truck is the star

/* ---------- world props ---------- */
const L = {};
const dog = { jump: 0 };
const bell = { swing: 0 };
const sun = { spin: 0 };
const hydrant = { spray: 0 };
const heli = { x: -60, y: 20, hop: 0, boost: 0 };
let clouds = [];
let parts = [];

/* ---------- pixel helpers ---------- */
function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.floor(x), Math.floor(y), w, h); }
function circle(cx, cy, r, c) {
  cx = Math.floor(cx); cy = Math.floor(cy);
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const dx = Math.floor(Math.sqrt((r + 0.5) ** 2 - dy * dy));
    g.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}
function glow(cx, cy, c) { g.globalAlpha = 0.35; circle(cx, cy, 5, c); g.globalAlpha = 1; }
function wheel(cx, cy, r, rot) {
  circle(cx, cy, r, TIRE);
  circle(cx, cy, r - 2, '#a7b0ba');
  if (r >= 6) circle(cx, cy, r - 4, '#e3e7eb');
  const sx = Math.round(Math.cos(rot) * (r - 3)), sy = Math.round(Math.sin(rot) * (r - 3));
  R(cx + sx, cy + sy, 1, 1, '#4d5560');
  R(cx - sx, cy - sy, 1, 1, '#4d5560');
}

// 3x5 bitmap font, just the letters the sign needs
const FONT = {
  A: '010101111101101', E: '111100110100111', F: '111100110100100', I: '111010010010111',
  N: '110101101101101', O: '010101101101010', R: '110101110101101', S: '011100010001110',
  T: '111010010010010', ' ': '000000000000000',
};
function text(str, x, y, s, c) {
  [...str].forEach((ch, i) => {
    const bits = FONT[ch] || FONT[' '];
    for (let b = 0; b < 15; b++) if (bits[b] === '1') R(x + i * 4 * s + (b % 3) * s, y + Math.floor(b / 3) * s, s, s, c);
  });
}

/* ---------- vehicle sprites (side view, facing right) ---------- */
function drawFire(x, yb, key, lit, ph, bob, rot) {
  const c = COLOR[key].c, y = yb - 38 + bob;
  const P = (dx, dy, w, h, col) => R(x + dx, y + dy, w, h, col);
  const stripe = key === 'white' ? '#e8222b' : '#f4f7fb';
  P(2, 29, 62, 3, '#2b2e36');                                   // chassis
  P(0, 12, 46, 18, c[1]); P(0, 12, 46, 1, c[0]); P(0, 28, 46, 2, c[2]);
  for (let i = 0; i < 3; i++) {                                  // equipment lockers
    const dx = 3 + i * 14;
    P(dx, 15, 12, 10, c[2]); P(dx + 1, 16, 10, 8, c[1]);
    P(dx + 1, 18, 10, 1, c[0]); P(dx + 1, 21, 10, 1, c[0]);
    P(dx + 8, 23, 2, 1, '#e9eef2');
  }
  P(0, 26, 64, 1, stripe);
  P(46, 8, 17, 22, c[1]); P(63, 11, 2, 19, c[1]);               // cab
  P(46, 8, 17, 1, c[0]); P(46, 28, 19, 2, c[2]);
  P(49, 10, 13, 1, c[2]); P(50, 11, 12, 7, GLASS); P(51, 12, 2, 2, '#ffffff'); P(62, 12, 1, 6, GLASS2);
  P(48, 19, 1, 9, c[2]); P(50, 21, 3, 1, '#e9eef2');
  P(3, 5, 40, 1, '#d5dce3'); P(3, 9, 40, 1, '#8b96a1');         // ladder
  for (let i = 0; i < 10; i++) P(4 + i * 4, 6, 1, 3, '#d5dce3');
  P(7, 10, 3, 2, '#6b7480'); P(36, 10, 3, 2, '#6b7480');
  P(61, 27, 5, 3, CHROME); P(64, 20, 1, 3, '#fff6b0');           // bumper, headlight
  P(47, 7, 14, 1, '#444a55');                                    // light bar
  P(48, 5, 5, 2, lit && ph === 0 ? RED_ON : RED_OFF);
  P(53, 5, 2, 2, lit ? '#ffffff' : '#bbbbbb');
  P(55, 5, 5, 2, lit && ph === 1 ? RED_ON : RED_OFF);
  if (lit) glow(x + (ph ? 57 : 50), y + 6, RED_ON);
  for (const wx of [12, 26, 53]) circle(x + wx, yb - 6 + bob, 7, WELL);
  for (const wx of [12, 26, 53]) wheel(x + wx, yb - 6, 6, rot);
}

function drawPolice(x, yb, key, lit, ph, bob, rot) {
  const c = COLOR[key].c, y = yb - 29 + bob;
  const P = (dx, dy, w, h, col) => R(x + dx, y + dy, w, h, col);
  const panel = key === 'white' ? '#2f3240' : '#f4f7fb';
  P(17, 6, 20, 1, c[0]); P(15, 7, 25, 7, c[1]); P(14, 9, 1, 5, c[1]); P(40, 9, 2, 5, c[1]);   // cabin
  P(16, 9, 1, 4, GLASS); P(17, 8, 9, 5, GLASS); P(28, 8, 10, 5, GLASS); P(38, 9, 1, 4, GLASS2);
  P(18, 9, 2, 1, '#ffffff'); P(26, 8, 2, 6, c[2]);
  P(1, 14, 54, 9, c[1]); P(0, 15, 56, 7, c[1]); P(1, 14, 54, 1, c[0]); P(0, 21, 56, 2, c[2]);  // body
  P(15, 15, 25, 6, panel); P(27, 15, 1, 6, c[2]);
  P(32, 17, 3, 1, '#ffd21f'); P(33, 16, 1, 3, '#ffd21f');      // badge
  P(55, 16, 1, 2, '#fff6b0'); P(0, 16, 1, 2, RED_ON);
  P(52, 21, 4, 2, CHROME); P(0, 21, 4, 2, CHROME);
  P(20, 3, 7, 2, lit && ph === 0 ? RED_ON : RED_OFF);             // light bar
  P(27, 3, 2, 2, '#dddddd');
  P(29, 3, 7, 2, lit && ph === 1 ? BLUE_ON : BLUE_OFF);
  P(19, 5, 18, 1, '#444a55');
  if (lit) glow(x + (ph ? 32 : 23), y + 4, ph ? BLUE_ON : RED_ON);
  for (const wx of [12, 44]) circle(x + wx, yb - 5 + bob, 6, WELL);
  for (const wx of [12, 44]) wheel(x + wx, yb - 5, 5, rot);
}

function drawAmb(x, yb, key, lit, ph, bob, rot) {
  const c = COLOR[key].c, y = yb - 36 + bob;
  const P = (dx, dy, w, h, col) => R(x + dx, y + dy, w, h, col);
  const warm = WARM.has(key);
  const stripe = warm ? '#f4f7fb' : '#e8222b', cross = warm ? '#ffffff' : '#e8222b';
  P(0, 6, 42, 24, c[1]); P(0, 6, 42, 1, c[0]); P(0, 28, 42, 2, c[2]);   // patient box
  P(42, 12, 16, 18, c[1]); P(58, 15, 3, 15, c[1]); P(42, 12, 16, 1, c[0]); P(42, 28, 19, 2, c[2]);  // cab
  P(45, 14, 11, 7, GLASS); P(46, 15, 2, 2, '#ffffff'); P(56, 15, 2, 6, GLASS2);
  P(44, 22, 1, 6, c[2]); P(47, 24, 3, 1, '#9aa3ad');
  P(3, 9, 1, 12, c[2]); P(5, 9, 5, 4, GLASS);
  P(0, 22, 61, 2, stripe);
  P(19, 9, 5, 12, cross); P(15, 13, 13, 4, cross);
  P(57, 27, 5, 3, CHROME); P(60, 19, 1, 3, '#fff6b0');
  P(1, 3, 6, 3, lit && ph === 0 ? RED_ON : RED_OFF);
  P(35, 3, 6, 3, lit && ph === 1 ? RED_ON : RED_OFF);
  P(46, 10, 8, 2, lit ? (ph ? '#ffffff' : RED_ON) : RED_OFF);
  if (lit) glow(x + (ph ? 38 : 4), y + 4, RED_ON);
  for (const wx of [12, 50]) circle(x + wx, yb - 6 + bob, 7, WELL);
  for (const wx of [12, 50]) wheel(x + wx, yb - 6, 6, rot);
}
const SPRITE = { fire: drawFire, police: drawPolice, amb: drawAmb };

/* ---------- sound (all synthesized) ---------- */
let ac = null, master = null, voiceOut = null, noiseBuf = null;
function initAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}  // play even with the silent switch on
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.32;               // gentle on little ears
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    voiceOut = ac.createGain();             // voice skips the quiet master so it sits above the sirens
    voiceOut.gain.value = 0.9;
    voiceOut.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(type, freq, start, dur, vol, freqEnd) {
  if (!ac) return;
  const t = ac.currentTime + start;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function noise(start, dur, vol, freq, q) {
  if (!ac) return;
  const t = ac.currentTime + start;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  s.buffer = noiseBuf; s.loop = true;
  f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(gn); gn.connect(master);
  s.start(t); s.stop(t + dur + 0.05);
}
function siren(kind) {
  if (!ac) return () => {};
  const t = ac.currentTime, MAX = 30;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), gn = ac.createGain();
  const extra = [];
  f.type = 'lowpass'; f.frequency.value = 2400;
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(0.16, t + 0.15);
  if (kind === 'fire') {               // horn blast, then a slow wail
    tone('square', 233, 0, 0.55, 0.12); tone('square', 277, 0, 0.55, 0.12);
    o.type = 'triangle';
    for (let k = 0; k < MAX / 2.4; k++) {
      o.frequency.setValueAtTime(520, t + k * 2.4);
      o.frequency.linearRampToValueAtTime(1150, t + k * 2.4 + 1.2);
      o.frequency.linearRampToValueAtTime(520, t + k * 2.4 + 2.4);
    }
  } else if (kind === 'police') {      // fast yelp
    o.type = 'triangle'; o.frequency.value = 1050;
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.type = 'triangle'; lfo.frequency.value = 4.5; depth.gain.value = 380;
    lfo.connect(depth); depth.connect(o.frequency);
    lfo.start(t); lfo.stop(t + MAX); extra.push(lfo);
  } else {                              // hi-lo
    o.type = 'triangle';
    for (let k = 0; k < MAX / 0.55; k++) o.frequency.setValueAtTime(k % 2 ? 770 : 960, t + k * 0.55);
  }
  o.connect(f); f.connect(gn); gn.connect(master);
  o.start(t); o.stop(t + MAX);
  let stopped = false;
  return () => {
    if (stopped) return; stopped = true;
    const n = ac.currentTime;
    gn.gain.cancelScheduledValues(n);
    gn.gain.setValueAtTime(gn.gain.value, n);
    gn.gain.exponentialRampToValueAtTime(0.0001, n + 0.4);
    o.stop(n + 0.45); extra.forEach(x => { try { x.stop(n + 0.45); } catch (e) {} });
  };
}
const SFX = {
  honk() { tone('square', 349, 0, 0.22, 0.12); tone('square', 440, 0, 0.22, 0.1); tone('square', 349, 0.28, 0.22, 0.12); tone('square', 440, 0.28, 0.22, 0.1); },
  paint() { noise(0, 0.18, 0.25, 900, 0.8); [523, 659, 784, 1047].forEach((f, i) => tone('sine', f, 0.05 + i * 0.07, 0.25, 0.18)); },
  bell() { [0, 0.45, 0.9].forEach(s => { tone('sine', 1320, s, 1.2, 0.2); tone('sine', 2640, s, 0.6, 0.06); tone('sine', 3960, s, 0.3, 0.03); }); },
  woof() { [0, 0.25].forEach(s => { tone('sawtooth', 320, s, 0.14, 0.18, 110); noise(s, 0.1, 0.12, 500, 1.5); }); },
  boing() { tone('sine', 200, 0, 0.18, 0.2, 700); tone('sine', 700, 0.18, 0.3, 0.15, 300); },
  water() { noise(0, 1.6, 0.18, 1800, 0.6); },
  sizzle() { noise(0, 0.7, 0.3, 3200, 0.6); tone('sine', 900, 0, 0.5, 0.08, 250); tone('sine', 1568, 0.15, 0.3, 0.12); },
  brake() { noise(0, 0.45, 0.22, 2600, 0.5); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, i * 0.13, 0.16, 0.09)); [523, 659, 784, 1047].forEach(f => tone('triangle', f, 0.6, 0.9, 0.12)); },
  chop() { for (let i = 0; i < 16; i++) noise(i * 0.08, 0.06, 0.3, 260, 1.2); },
};

/* ---------- voice (recorded clips in audio/) ---------- */
const LINES = {
  fire:   ['fire-truck', 'here-comes-the-fire-truck', 'fire-truck-to-the-rescue'],
  police: ['police-car', 'here-comes-the-police-car', 'police-car-on-duty'],
  amb:    ['ambulance', 'here-comes-the-ambulance', 'ambulance-on-the-way', 'ambulance-here-to-help'],
  wow:    ['ooh-pretty', 'now-thats-a-cool-color'],
  parked: ['all-parked', 'great-job', 'you-did-it'],
};
const CLIP_NAMES = [...new Set([...Object.values(LINES).flat(), ...PALETTE.map(p => p[0]), 'back-to-the-station', 'helicopter', 'lets-go'])];
const clipBytes = {}, clipBuf = {};
for (const n of CLIP_NAMES) {
  clipBytes[n] = fetch('audio/' + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
}
function clip(n) {
  if (!ac) return Promise.resolve(null);
  if (!clipBuf[n]) clipBuf[n] = (clipBytes[n] || Promise.resolve(null)).then(b => b && new Promise(res => {
    try { ac.decodeAudioData(b.slice(0), res, () => res(null)); } catch (e) { res(null); }
  }));
  return clipBuf[n];
}
const lastPick = {};
function pick(key) {   // random line, never the same one twice in a row
  const list = LINES[key];
  let n;
  do { n = list[Math.random() * list.length | 0]; } while (list.length > 1 && n === lastPick[key]);
  return (lastPick[key] = n);
}
let voiceSrc = null, voiceToken = 0, voiceUntil = 0;
function duck(dur) {   // dip the sirens while someone is talking
  const n = ac.currentTime, g = master.gain;
  g.cancelScheduledValues(n); g.setValueAtTime(g.value, n);
  g.linearRampToValueAtTime(0.12, n + 0.08);
  g.setValueAtTime(0.12, n + dur);
  g.linearRampToValueAtTime(0.32, n + dur + 0.35);
}
// say('red') or say(['red', 'ooh-pretty']). A tap interrupts whatever is playing;
// polite lines (e.g. on parking) are skipped if someone is already talking.
function say(names, polite) {
  if (!ac || (polite && ac.currentTime < voiceUntil)) return;
  const token = ++voiceToken;
  if (voiceSrc) { try { voiceSrc.stop(); } catch (e) {} voiceSrc = null; }
  const list = [].concat(names);
  const next = i => {
    if (i >= list.length || token !== voiceToken) return;
    clip(list[i]).then(buf => {
      if (token !== voiceToken) return;
      if (!buf) return next(i + 1);
      const src = ac.createBufferSource();
      src.buffer = buf; src.connect(voiceOut); src.start();
      voiceSrc = src; voiceUntil = ac.currentTime + buf.duration;
      duck(buf.duration);
      src.onended = () => { if (voiceSrc === src) voiceSrc = null; next(i + 1); };
    });
  };
  next(0);
}
let paintCount = 0;

/* ---------- layout ---------- */
function resize() {
  dpr = window.devicePixelRatio || 1;
  const dw = Math.round(stage.clientWidth * dpr), dh = Math.round(stage.clientHeight * dpr);
  S = Math.max(1, Math.floor(Math.min(dw / 300, dh / 196)));
  W = Math.ceil(dw / S); H = Math.ceil(dh / S);
  lo.width = W; lo.height = H;
  cv.width = W * S; cv.height = H * S;
  cv.style.width = (W * S / dpr) + 'px'; cv.style.height = (H * S / dpr) + 'px';
  layout();
}
function layout() {
  L.blob = Math.max(22, Math.min(36, Math.floor((W - 24) / 9) - 4));
  L.gap = Math.max(3, Math.min(8, Math.floor((W - 9 * L.blob) / 12)));
  L.palH = L.blob + 14; L.palY = H - L.palH;
  L.roadH = 46; L.roadY = L.palY - L.roadH;
  L.floorY = L.roadY;
  L.laneY = L.roadY + L.roadH - 6;
  L.bayW = 76; L.bayGap = 6; L.bayH = 50;

  for (let r = 0; r < F.rows; r++) for (let c = 0; c < 3; c++) {
    if (r === 0 && c === 1) continue;  // front door
    F.windows.push({ x: F.hx + 10 + c * 30, y: L.floorY - (r + 1) * 28 + 7 });
  }
  F.nozX = F.ffX + 14; F.nozY = L.laneY - 15;
  F.homeBtn = { x: 8, y: L.palY + Math.floor((L.palH - L.blob) / 2), s: L.blob };
  const big = L.blob + 10;
  F.againBtn = { x: Math.floor(W / 2 - big / 2), y: L.palY + Math.floor((L.palH - big) / 2), s: big };
  F.fireBtn = { x: 20, y: 20, r: 15 };
  if (F.state !== 'arrive') F.tx = F.truckX;
}
function newFire() {
  const idx = F.windows.map((_, i) => i).sort(() => Math.random() - 0.5);
  const n = Math.min(idx.length, 3 + (Math.random() * (F.rows > 2 ? 4 : 2) | 0));
  F.flames = idx.slice(0, n).map(i => ({ w: i, hp: 1, seed: Math.random() * 10, out: false, who: Math.random() * 3 | 0, skin: SKIN[Math.random() * SKIN.length | 0] }));
  F.wall = HOUSE_COLORS[Math.random() * HOUSE_COLORS.length | 0];
  F.doneT = 0; F.spray = 0; F.jump = 0;
  parts = [];
}
function startMission() {
  const v = V[1];
  if (F.state === 'mission' || scene !== 'station' || wipe) return;
  selected = 1;
  SFX.bell();
  v.mission = true; F.state = 'mission';
  if (v.state === 'parked') startTrip(v);
  else if (v.lap || v.state === 'enter') {   // already heading home: turn around and go
    if (!v.stopSiren) v.stopSiren = siren('fire');
    Object.assign(v, { state: 'drive', lap: false, y: L.laneY });
  }
}
function enterFire() {
  scene = 'fire'; parts = [];
  F.state = 'arrive'; F.tx = -72;
  newFire();
}
function goHome() {
  if (wipe) return;
  setSpray(false); held = null;
  startWipe(() => {
    scene = 'station'; parts = []; F.state = 'off';
    const v = V[1];
    if (v.stopSiren) { v.stopSiren(); v.stopSiren = null; }
    Object.assign(v, { state: 'drive', lap: true, mission: false, x: -v.len - 8, y: L.laneY, speed: 120 });
  });
}
function setSpray(on) {
  if (!ac) return;
  if (!sprayGain) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter();
    sprayGain = ac.createGain(); sprayGain.gain.value = 0;
    s.buffer = noiseBuf; s.loop = true;
    f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.7;
    s.connect(f); f.connect(sprayGain); sprayGain.connect(master); s.start();
  }
  sprayGain.gain.setTargetAtTime(on ? 0.35 : 0, ac.currentTime, 0.05);
}
function aimAt(x, y) {
  // toddler aim assist: snap to the nearest burning window within reach
  let best = null, bd = 34 * 34;
  for (const f of F.flames) {
    if (f.out) continue;
    const w = F.windows[f.w], cx = w.x + 8, cy = w.y + 4;
    const d = (x - cx) ** 2 + (y - cy) ** 2;
    if (d < bd) { bd = d; best = [cx, cy]; }
  }
  [F.aimX, F.aimY] = best || [x, Math.min(y, L.laneY - 4)];
}
function inBox(b, x, y) { return x >= b.x - 4 && x < b.x + b.s + 4 && y >= b.y - 4 && y < b.y + b.s + 4; }
function fireTap(x, y, id) {
  if (inBox(F.homeBtn, x, y)) { goHome(); return; }
  if (F.state === 'done' && F.doneT > 1.2 && inBox(F.againBtn, x, y)) { SFX.bell(); newFire(); F.state = 'spray'; return; }
  if (F.state === 'spray') { held = id; aimAt(x, y); F.spray = 0.4; }
}

function updateFire(dt) {
  if (F.state === 'arrive') {
    F.tx = Math.min(F.truckX, F.tx + Math.max(22, Math.min(150, (F.truckX - F.tx) * 2.5)) * dt);
    V[1].rot += dt * 20;
    F.smoke -= dt;
    if (F.smoke <= 0) { F.smoke = 0.09; parts.push({ x: F.tx - 1, y: L.laneY - 7, vx: -12, vy: -14, g: 0, life: 0.6, max: 0.6, s: 2, c: '#c9ccd3' }); }
    if (F.tx >= F.truckX) {
      F.state = 'spray';
      const v = V[1]; if (v.stopSiren) { v.stopSiren(); v.stopSiren = null; }
      SFX.brake();
    }
  }
  if (held !== null && F.state === 'spray') F.spray = 0.3;
  F.spray = Math.max(0, F.spray - dt);
  const spraying = F.spray > 0 && F.state === 'spray';
  setSpray(spraying);
  if (spraying) {
    spawn(2, () => ({ x: F.aimX, y: F.aimY, vx: (Math.random() - 0.5) * 70, vy: -20 - Math.random() * 50, g: 260, life: 0.45, max: 0.45, s: 1 + (Math.random() * 2 | 0), c: Math.random() < 0.5 ? '#6fc8ff' : '#ffffff' }));
  }
  let burning = 0;
  for (const f of F.flames) {
    if (f.out) continue;
    const w = F.windows[f.w], cx = w.x + 8, cy = w.y + 4;
    if (spraying && Math.abs(F.aimX - cx) < 12 && Math.abs(F.aimY - cy) < 14) {
      f.hp -= dt / 0.9;
      if (Math.random() < 0.5) parts.push({ x: cx + (Math.random() - 0.5) * 10, y: w.y, vx: (Math.random() - 0.5) * 10, vy: -25, g: 0, life: 0.8, max: 0.8, s: 3, c: '#dfe3ea' });
    }
    if (f.hp <= 0) {
      f.out = true; SFX.sizzle();
      spawn(14, () => ({ x: cx + (Math.random() - 0.5) * 14, y: w.y + Math.random() * 8, vx: (Math.random() - 0.5) * 20, vy: -20 - Math.random() * 25, g: 0, life: 1.1, max: 1.1, s: 3, c: Math.random() < 0.5 ? '#c9ccd3' : '#eef0f4' }));
      spawn(8, () => ({ x: cx + (Math.random() - 0.5) * 20, y: cy + (Math.random() - 0.5) * 16, vx: 0, vy: -12, g: 0, life: 0.7, max: 0.7, s: 1, c: '#fff27a', star: true }));
      continue;
    }
    burning++;
    if (Math.random() < dt * 5) parts.push({ x: cx + (Math.random() - 0.5) * 8, y: w.y - 12 * f.hp, vx: 4, vy: -14, g: 0, life: 1.2, max: 1.2, s: 3, c: '#7d7f88' });
  }
  if (burning && F.state === 'spray') {
    F.crackle -= dt;
    if (F.crackle <= 0) { F.crackle = 0.05 + Math.random() * 0.18; noise(0, 0.03, 0.06, 1500 + Math.random() * 2500, 3); }
  }
  if (!burning && F.state === 'spray' && F.flames.length) { F.state = 'done'; F.doneT = 0; held = null; SFX.fanfare(); }
  if (F.state === 'done') {
    F.doneT += dt;
    F.jump = Math.abs(Math.sin(F.doneT * 6)) * (F.doneT < 2.5 ? 5 : 0);
    if (F.doneT < 1.8) spawn(3, () => ({ x: Math.random() * W, y: -2, vx: (Math.random() - 0.5) * 30, vy: 30 + Math.random() * 40, g: 40, life: 2.5, max: 2.5, s: 2, c: PALETTE[Math.random() * 7 | 0][2][1] }));
  }
}

/* ---------- fire scene drawing ---------- */
function flame(cx, by, size, seed) {
  const h = Math.round(5 + size * 15), w = Math.round(5 + size * 9);
  for (let i = 0; i < w; i++) {
    const edge = 1 - Math.abs((i - (w - 1) / 2) / (w / 2));
    const fl = 0.7 + 0.3 * Math.sin(T * 14 + i * 1.3 + seed);
    const hh = Math.max(1, Math.round(h * edge * fl));
    const x = cx - (w >> 1) + i;
    R(x, by - hh, 1, hh, '#e8222b');
    const h2 = Math.round(hh * 0.7); if (h2) R(x, by - h2, 1, h2, '#f57a12');
    const h3 = Math.round(hh * 0.4); if (h3) R(x, by - h3, 1, h3, '#ffd21f');
  }
}
function drawFireScene() {
  const hx = F.hx, hy = F.hy, hw = F.hw, wall = F.wall;
  // roof and chimney
  R(hx + hw - 26, hy - 24, 8, 16, '#8e3b2a');
  for (let k = 0; k * 8 < hw + 8; k++) R(hx - 4 + k * 4, hy - 2 - k * 2, hw + 8 - k * 8, 2, k % 2 ? '#a3473a' : '#b5523b');
  R(hx - 5, hy - 2, hw + 10, 2, '#7a2f24');
  // walls
  R(hx, hy, hw, F.hh, wall);
  g.globalAlpha = 0.15; R(hx, hy, 3, F.hh, '#000000'); R(hx + hw - 3, hy, 3, F.hh, '#000000'); g.globalAlpha = 1;
  for (let r = 1; r < F.rows; r++) R(hx, L.floorY - r * 28, hw, 1, '#ffffff');
  // door
  const dx = hx + 40;
  R(dx - 1, L.floorY - 23, 18, 23, '#ffffff'); R(dx, L.floorY - 22, 16, 22, '#8a5a3a');
  R(dx + 2, L.floorY - 20, 12, 8, '#9c6a48'); R(dx + 12, L.floorY - 11, 2, 2, '#ffd21f');
  // windows
  const byWin = {}; F.flames.forEach(f => { byWin[f.w] = f; });
  F.windows.forEach((w, i) => {
    const f = byWin[i];
    R(w.x - 2, w.y - 2, 20, 18, '#ffffff');
    if (f && !f.out) {
      R(w.x, w.y, 16, 14, Math.floor(T * 8 + f.seed) % 2 ? '#ffb347' : '#ff9a3a');
      g.globalAlpha = 0.25; circle(w.x + 8, w.y + 6, 12, '#ff9a3a'); g.globalAlpha = 1;
    } else if (f && f.out) {
      R(w.x, w.y, 16, 14, '#fff3c4');
      const cx = w.x + 8, wave = Math.floor(T * 6 + f.seed) % 2;
      if (f.who === 2) {   // a kitty
        circle(cx, w.y + 8, 4, '#9aa3ad'); R(cx - 4, w.y + 2, 2, 3, '#9aa3ad'); R(cx + 3, w.y + 2, 2, 3, '#9aa3ad');
        R(cx - 2, w.y + 7, 1, 1, '#22222a'); R(cx + 2, w.y + 7, 1, 1, '#22222a'); R(cx, w.y + 9, 1, 1, '#ff6fb4');
      } else {             // a neighbor, waving
        const px = cx - 2;
        R(px - 5, w.y + 11, 11, 3, f.who ? '#2a6fe0' : '#3fb43a');
        circle(px, w.y + 6, 4, f.skin);
        R(px - 4, w.y + 1, 9, 3, f.who ? '#5a3a22' : '#e8b03a');
        R(px - 2, w.y + 5, 1, 2, '#22222a'); R(px + 2, w.y + 5, 1, 2, '#22222a');
        R(px - 2, w.y + 8, 1, 1, '#a3121d'); R(px - 1, w.y + 9, 3, 1, '#a3121d'); R(px + 2, w.y + 8, 1, 1, '#a3121d');
        R(px + 6, w.y + (wave ? 2 : 4), 2, 7, f.skin);
      }
      g.globalAlpha = 0.3; R(w.x + 2, w.y - 5, 12, 3, '#3a3d46'); g.globalAlpha = 1;
    } else {
      R(w.x, w.y, 16, 14, '#bfe6ff'); R(w.x + 2, w.y + 2, 3, 2, '#ffffff');
    }
    if (!(f && f.out)) R(w.x + 7, w.y, 2, 14, '#ffffff');
    if (f && !f.out) flame(w.x + 8, w.y + 14, f.hp, f.seed);
  });
  drawRoad();
  // truck, hose, firefighter
  const v = V[1], ph = Math.floor(T * 7) % 2;
  const bob = F.state === 'arrive' ? (Math.floor(F.tx / 7) % 2 ? 0 : -1) : 0;
  if (F.state !== 'arrive') {
    R(F.truckX + 30, L.laneY - 2, F.ffX - F.truckX - 28, 2, '#3a3d46');
  }
  SPRITE.fire(Math.floor(F.tx), L.laneY, v.color, true, ph, bob, v.rot);
  if (F.state !== 'arrive') drawFirefighter(F.ffX, L.laneY - Math.round(F.jump));
  if (F.spray > 0 && F.state === 'spray') drawStream();
  drawParticles();
  drawStrip();
  drawHomeButton(F.homeBtn);
  if (F.state === 'done' && F.doneT > 1.2) drawAgainButton(F.againBtn);
}
function drawFirefighter(x, yb) {
  R(x + 2, yb - 3, 3, 3, '#22222a'); R(x + 6, yb - 3, 3, 3, '#22222a');
  R(x + 2, yb - 8, 7, 5, '#c9a24a'); R(x + 2, yb - 6, 7, 1, '#e9f56b');
  R(x + 1, yb - 15, 9, 8, '#d8b04f'); R(x + 1, yb - 11, 9, 1, '#e9f56b');
  R(x + 3, yb - 19, 5, 4, '#f1c7a0'); R(x + 6, yb - 18, 1, 1, '#22222a'); R(x + 5, yb - 16, 2, 1, '#a3121d');
  R(x + 2, yb - 21, 7, 2, '#e8222b'); R(x + 1, yb - 19, 10, 1, '#e8222b'); R(x + 4, yb - 22, 3, 1, '#e8222b');
  R(x + 8, yb - 14, 4, 2, '#d8b04f'); R(x + 11, yb - 16, 3, 3, '#9aa3ad');
  R(x, yb - 13, 2, 11, '#3a3d46');   // hose up the back
}
function drawStream() {
  const nx = F.nozX, ny = F.nozY, tx = F.aimX, ty = F.aimY;
  const cx = (nx + tx) / 2, cy = Math.min(ny, ty) - 18 - Math.abs(tx - nx) * 0.15;
  const n = Math.max(12, Math.floor(Math.hypot(tx - nx, ty - ny) / 2));
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    const px = u * u * nx + 2 * u * t * cx + t * t * tx, py = u * u * ny + 2 * u * t * cy + t * t * ty;
    R(px, py, 2, 2, (i + Math.floor(T * 30)) % 3 ? '#6fc8ff' : '#ffffff');
  }
}
function drawStrip() {
  R(0, L.palY, W, H - L.palY, '#5aa84c');
  R(0, L.palY, W, 2, '#4a9440');
  for (let xx = 7; xx < W; xx += 23) { R(xx, L.palY + 5 + (xx % 3), 1, 2, '#7cc96a'); R(xx + 11, H - 4 - (xx % 2), 1, 2, '#7cc96a'); }
}
function button(b, bg, dark) {
  const { x, y, s } = b;
  R(x, y + 2, s, s, '#2f6b29');
  R(x + 2, y - 2, s - 4, s + 4, '#ffffff'); R(x - 2, y + 2, s + 4, s - 4, '#ffffff'); R(x, y, s, s, '#ffffff');
  R(x + 2, y, s - 4, s, bg); R(x, y + 2, s, s - 4, bg);
  R(x + 2, y + s - 3, s - 4, 3, dark);
}
function drawHomeButton(b) {
  button(b, '#2a6fe0', '#1a3f9a');
  const cx = b.x + b.s / 2, s = b.s;
  for (let k = 0; k < 6; k++) R(cx - 1 - k * 1.6, b.y + s * 0.22 + k * 1.6, 2 + k * 3.2, 2, '#e8222b');
  R(cx - s * 0.28, b.y + s * 0.5, s * 0.56, s * 0.3, '#fff6e0');
  R(cx - 2, b.y + s * 0.6, 4, s * 0.2, '#8a5a3a');
}
function drawAgainButton(b) {
  const p = Math.round(Math.sin(T * 5) * 1.5);
  const bb = { x: b.x - p, y: b.y - p, s: b.s + 2 * p };
  button(bb, '#e8222b', '#a3121d');
  flame(bb.x + bb.s / 2, bb.y + bb.s - 6, 1.6, 0);
}
function drawFireButton() {
  if (F.state === 'mission') return;
  const { x, y, r } = F.fireBtn, p = Math.round((Math.sin(T * 4) + 1) * 1.2);
  circle(x, y + 2, r + 2, '#2f6b29');
  circle(x, y, r + 2 + p, '#ffffff');
  circle(x, y, r, '#e8222b');
  flame(x, y + 9, 1.15, 1);
}
function drawWipe() {
  if (!wipe) return;
  const k = wipe.t < 0.35 ? wipe.t / 0.35 : 1 - (wipe.t - 0.35) / 0.35;
  for (let y = 0, i = 0; y < H; y += 8, i++) {
    const w = Math.ceil(W * Math.min(1, k * 1.15));
    R(i % 2 ? W - w : 0, y, w, 8, '#1d1a2b');
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  update(Math.min(0.05, (now - last) / 1000));
  last = now;
  draw();
  requestAnimationFrame(frame);
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});   // offline play; not available in every viewer
}
new ResizeObserver(resize).observe(stage);
resize();
requestAnimationFrame(frame);

// Home-screen icon helper: the fire truck on its road, as an n×n PNG data URL.
window.__renderIcon = n => {
  const c = document.createElement('canvas'); c.width = c.height = 80;
  const prev = g; g = c.getContext('2d');
  R(0, 0, 80, 80, '#8fd6ff'); R(0, 56, 80, 24, '#4b4f5c'); R(0, 56, 80, 3, '#bdb8ac');
  for (let x = 2; x < 80; x += 16) R(x, 70, 8, 2, '#ffd21f');
  drawFire(7, 64, 'red', false, 0, 0, 0.6);
  g = prev;
  const out = document.createElement('canvas'); out.width = out.height = n;
  const o = out.getContext('2d'); o.imageSmoothingEnabled = false; o.drawImage(c, 0, 0, n, n);
  return out.toDataURL('image/png');
};
})();
